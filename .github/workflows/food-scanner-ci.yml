name: Food Scanner Safety

on:
  pull_request:
    paths:
      - "app/services/food_scan.py"
      - "app/routers/food_scan.py"
      - "app/main.py"
      - "tests/test_food_scanner.py"
      - "tests/test_food_scanner_contract.py"
      - "tests/test_food_scanner_postgres.py"
      - ".github/workflows/food-scanner-ci.yml"
  workflow_dispatch:

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax
        run: python -m compileall -q app/services/food_scan.py app/routers/food_scan.py app/main.py tests/test_food_scanner.py
      - name: Validate scanner without provider network calls
        run: python -m unittest discover -s tests -p 'test_food_scanner.py' -v

  scanner-http-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: delphiafit_scanner_test
          POSTGRES_USER: scanner_qa
          POSTGRES_PASSWORD: disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner_qa -d delphiafit_scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JWT_SECRET: scanner-ci-only-key-not-for-production
      DATABASE_URL: "sqlite://"
      DISPOSABLE_POSTGRES_TEST_URL: "postgresql+psycopg2://scanner_qa:disposable-only@127.0.0.1:5432/delphiafit_scanner_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner integration test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Verify scanner contracts and private history with test accounts
        run: python -m pytest -q tests/test_food_scanner_contract.py
      - name: Verify simultaneous history saves on disposable PostgreSQL
        run: python -m pytest -q tests/test_food_scanner_postgres.py
